[package]
name = "ambient-light-detector"
version = "0.3.0"
edition = "2021"
description = "Daemon that adjusts screen brightness based on ambient light detected via webcam"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
image = "0.25"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
rscam = "0.5"